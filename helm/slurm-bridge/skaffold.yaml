# https://skaffold.dev/docs/references/yaml/
apiVersion: skaffold/v4beta14
kind: Config
build:
  artifacts:
    - image: slinky.slurm.net/slurm-bridge-scheduler
      runtimeType: go
      context: ../../
      docker:
        dockerfile: Dockerfile
        target: scheduler
    - image: slinky.slurm.net/slurm-bridge-admission
      runtimeType: go
      context: ../../
      docker:
        dockerfile: Dockerfile
        target: admission
    - image: slinky.slurm.net/slurm-bridge-controllers
      runtimeType: go
      context: ../../
      docker:
        dockerfile: Dockerfile
        target: controllers
  tagPolicy:
    inputDigest: {}
  local:
    useDockerCLI: true
deploy:
  helm:
    flags:
      upgrade:
        - --reset-values
    releases:
      - name: slurm-bridge
        chartPath: ./
        valuesFiles:
          - ./values-dev.yaml
        setValueTemplates:
          scheduler.image.repository: '{{.IMAGE_REPO_slinky_slurm_net_slurm_bridge_scheduler}}'
          scheduler.image.tag: '{{.IMAGE_TAG_slinky_slurm_net_slurm_bridge_scheduler}}'
          admission.image.repository: '{{.IMAGE_REPO_slinky_slurm_net_slurm_bridge_admission}}'
          admission.image.tag: '{{.IMAGE_TAG_slinky_slurm_net_slurm_bridge_admission}}'
          controllers.image.repository: '{{.IMAGE_REPO_slinky_slurm_net_slurm_bridge_controllers}}'
          controllers.image.tag: '{{.IMAGE_TAG_slinky_slurm_net_slurm_bridge_controllers}}'
        # Profiles add individual keys under overrides, so several can be active
        # at once; a JSON-patch add needs the parent map to exist.
        overrides:
          schedulerConfig: {}
        namespace: slurm
        createNamespace: true
profiles:
  - name: kubernetes-1-35
    activation:
      - env: 'KUBERNETES_VERSION=^v1\.35(\..*)?$'
    patches:
      - op: add
        path: /deploy/helm/releases/0/setValues
        value:
          scheduler.featureGates.SlurmBridgeGenericWorkload: false
  # Co-resident node sharing for hack/kind.sh --slurm-node-sharing=coResident.
  - name: co-resident
    activation:
      - env: 'SLURM_NODE_SHARING=^coResident$'
    patches:
      - op: add
        path: /deploy/helm/releases/0/overrides/schedulerConfig/nodeSharing
        value: coResident
      - op: add
        path: /deploy/helm/releases/0/overrides/schedulerConfig/mcsLabel
        value: ''
  - name: batch-placeholder
    activation:
      - env: 'SLURM_PLACEHOLDER=^batch$'
    patches:
      - op: add
        path: /deploy/helm/releases/0/overrides/schedulerConfig/placeholder
        value: batch
      # Below the HOLD_MAX that hack/kind.sh gives the e2e epilog.
      - op: add
        path: /deploy/helm/releases/0/overrides/schedulerConfig/maxTerminationGracePeriodSeconds
        value: 60
portForward:
  - resourceType: deployment
    resourceName: slurm-bridge-scheduler
    namespace: slurm
    port: 56268
    localPort: 40000
  - resourceType: deployment
    resourceName: slurm-bridge-controllers
    namespace: slurm
    port: 56268
    localPort: 40001
  - resourceType: deployment
    resourceName: slurm-bridge-admission
    namespace: slurm
    port: 56268
    localPort: 40002
